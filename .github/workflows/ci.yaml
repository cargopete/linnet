name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the same gate.
  YATR_VERSION: "1.2.0"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - name: Install dependencies and generate code (drift)
        run: yatr gen

      - name: Verify formatting
        run: yatr fmt-check

      - name: Analyze
        run: yatr analyze

      - name: Run tests
        run: yatr test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
